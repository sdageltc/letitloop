<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#0B0D14" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#FF5E8A" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="loopPathGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" rx="160" fill="url(#bgGrad)" />

  <!-- Ambient Backdrop Aura -->
  <circle cx="280" cy="400" r="160" fill="#FF3366" opacity="0.12" filter="blur(40px)" />
  <circle cx="520" cy="400" r="160" fill="#8A2BE2" opacity="0.12" filter="blur(40px)" />
  <circle cx="400" cy="400" r="120" fill="#00E5FF" opacity="0.15" filter="blur(30px)" />

  <!-- Concentric Infinity Loop Circuit Paths -->
  <!-- Outer Loop Track -->
  <path d="M 280 250 C 180 250 120 310 120 400 C 120 490 180 550 280 550 C 360 550 400 480 400 400 C 400 320 440 250 520 250 C 620 250 680 310 680 400 C 680 490 620 550 520 550 C 440 550 400 480 400 400 C 400 320 360 250 280 250 Z"
        fill="none" stroke="url(#loopPathGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Inner Concentric Orbit Track -->
  <path d="M 280 290 C 205 290 160 335 160 400 C 160 465 205 510 280 510 C 340 510 375 455 400 400 C 425 345 460 290 520 290 C 595 290 640 335 640 400 C 640 465 595 510 520 510 C 460 510 425 455 400 400 C 375 345 340 290 280 290 Z"
        fill="none" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" opacity="0.75" filter="url(#glowCyan)" />

  <!-- Left Capital 'L' (Strawberry Pink) -->
  <g filter="url(#glowPink)">
    <!-- Vertical stem + base of L -->
    <path d="M 220 280 L 270 280 C 275 280 280 285 280 290 L 280 470 L 350 470 C 355 470 360 475 360 480 L 360 520 C 360 525 355 530 350 530 L 230 530 C 224 530 220 526 220 520 Z" 
          fill="url(#pinkGrad)" />
  </g>

  <!-- Center 'i' (Electric Cyan - Exactly ONE Single Dot + Clean Stem) -->
  <g filter="url(#glowCyan)">
    <!-- Single Glowing Dot -->
    <circle cx="400" cy="315" r="24" fill="url(#cyanGrad)" />
    <!-- Lower Stem -->
    <rect x="382" y="365" width="36" height="165" rx="18" fill="url(#cyanGrad)" />
  </g>

  <!-- Right Capital 'L' (Electric Ultraviolet / Purple) -->
  <g filter="url(#glowViolet)">
    <!-- Vertical stem + base of L -->
    <path d="M 520 280 L 570 280 C 575 280 580 285 580 290 L 580 470 L 650 470 C 655 470 660 475 660 480 L 660 520 C 660 525 655 530 650 530 L 530 530 C 524 530 520 526 520 520 Z" 
          fill="url(#violetGrad)" />
  </g>
</svg>
