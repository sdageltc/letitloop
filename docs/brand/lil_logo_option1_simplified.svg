<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121522" />
      <stop offset="100%" stop-color="#090B10" />
    </radialGradient>

    <!-- Ribbon Gradient: Sakura Pink -> Electric Lavender -> Cyan -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5388" />
      <stop offset="35%" stop-color="#D946EF" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" rx="160" fill="url(#bgGrad1)" />

  <!-- Ambient Glow Behind Loop -->
  <circle cx="280" cy="400" r="140" fill="#FF5388" opacity="0.15" filter="blur(50px)" />
  <circle cx="520" cy="400" r="140" fill="#00F2FE" opacity="0.15" filter="blur(50px)" />

  <!-- The Simplified, Untangled "L I L" Infinite Flow Ribbon -->
  <!-- Left L loop -> Center I stem -> Right L loop -->
  <g filter="url(#softGlow)">
    <!-- Single Untangled Infinity Stroke forming L - I - L -->
    <path d="M 280 250 
             C 170 250, 140 330, 140 400 
             C 140 490, 200 550, 290 550 
             C 360 550, 390 480, 400 420 
             L 400 550 
             M 400 420 
             C 410 480, 440 550, 510 550 
             C 600 550, 660 490, 660 400 
             C 660 330, 630 250, 520 250 
             C 430 250, 380 340, 280 250 Z" 
          fill="none" 
          stroke="url(#ribbonGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Left 'L' Bold Upright Bar Accent -->
    <path d="M 230 280 L 230 510 L 320 510" 
          fill="none" 
          stroke="#FF5388" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.95" />

    <!-- Center 'i' Dot (Exactly ONE Dot) -->
    <circle cx="400" cy="330" r="22" fill="#00F2FE" filter="url(#dotGlow)" />

    <!-- Right 'L' Bold Upright Bar Accent -->
    <path d="M 570 280 L 570 510 L 480 510" 
          fill="none" 
          stroke="#00F2FE" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.95" />
  </g>
</svg>
