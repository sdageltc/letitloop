name: Bug Report
description: Create a report to help us improve letitloop
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Share step-by-step instructions or contract JSON to reproduce.
      placeholder: |
        1. Run `lil propose ...`
        2. Execute step ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: letitloop Version & Environment
      placeholder: "e.g., letitloop 0.1.0, Python 3.11, Windows 11 / Ubuntu 22.04"
    validations:
      required: true
