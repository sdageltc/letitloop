name: Bug Report
description: Create a report to help us improve durability and verification.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug report! Please provide reproducible steps.
  - type: input
    id: environment
    attributes:
      label: Operating System & Python/Node Version
      placeholder: e.g. Ubuntu 22.04 / Python 3.11.8 / Node 20
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      placeholder: Exact commands or code snippet to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Output / Error Logs
      render: shell
    validations:
      required: true
