name: Automated Issue Claim

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  auto-assign:
    if: |
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/claim') || 
       startsWith(github.event.comment.body, '/take') ||
       startsWith(github.event.comment.body, '/assign'))
    runs-on: ubuntu-latest
    steps:
      - name: Process Issue Claim
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const commenter = context.payload.comment.user.login;
            const isLocked = issue.labels.some(l => l.name === 'agent-locked');
            
            // 1. Guard against claiming agent-locked issues
            if (isLocked) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `@${commenter} this issue is currently reserved for autonomous agent development and cannot be claimed.`
              });
              return;
            }

            // 2. Guard against duplicate assignments
            if (issue.assignees && issue.assignees.length > 0) {
              const currentAssignee = issue.assignees[0].login;
              if (currentAssignee === commenter) {
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: 'eyes'
                });
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `@${commenter} this issue is already assigned to @${currentAssignee}.`
              });
              return;
            }

            // 3. Assign the contributor
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [commenter]
            });

            // 4. React and welcome the contributor
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Assigned @${commenter} to this issue! 🚀\n\nThanks for contributing! Feel free to open a draft PR once you're ready to share your progress.`
            });
