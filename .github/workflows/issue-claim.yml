name: Automated Issue Claim

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  auto-assign:
    if: ${{ !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Process Issue Claim
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = (context.payload.comment.body || '').trim().toLowerCase();
            const issue = context.payload.issue;
            const commenter = context.payload.comment.user.login;

            // 1. Detect Claim Intent (Slash Commands + Natural Language)
            const isCommand = /^\/(claim|take|assign)|^\.(take|claim)/i.test(body);
            const isNaturalClaim = (
              /(i'd like to|i would like to|i want to|can i|could i|may i|i can|i'd love to|i would love to)\s+(work on|take|tackle|contribute to|implement|handle|help with|fix)/i.test(body) ||
              /(please\s+)?assign\s+(this\s+to\s+me|me(\s+to\s+this)?)/i.test(body) ||
              /(can i|may i|could i)\s+(take|claim|have)\s+(this|it)/i.test(body) ||
              /happy to (take|work on) (this|it)/i.test(body) ||
              (/first open-source contribution/i.test(body) && /(work on|take|contribute)/i.test(body))
            );

            if (!isCommand && !isNaturalClaim) {
              return; // Not a claim request
            }

            // 2. Guard against claiming agent-locked issues
            const isLocked = (issue.labels || []).some(l => l.name === 'agent-locked');
            if (isLocked) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `@${commenter} this issue is currently reserved for autonomous agent development and cannot be claimed.`
              });
              return;
            }

            // 3. Guard against duplicate / existing assignments
            if (issue.assignees && issue.assignees.length > 0) {
              const currentAssignee = issue.assignees[0].login;
              if (currentAssignee === commenter) {
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: 'eyes'
                });
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `@${commenter} this issue is already assigned to @${currentAssignee}. Feel free to check out other unassigned issues with the \`good first issue\` label!`
              });
              return;
            }

            // 4. Assign the contributor
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [commenter]
            });

            // 5. React and welcome the contributor
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Welcome @${commenter}! 🎉 This issue is now assigned to you.\n\nFeel free to ask any questions in this thread if you need guidance on repo setup, decorators, or testing. Looking forward to your contribution!`
            });
