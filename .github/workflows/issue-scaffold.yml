name: Issue Reproduction Scaffolder

on:
  issues:
    types: [labeled]

jobs:
  scaffold-reproduction:
    if: github.event.label.name == 'reproduce-bug'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Bugfix Reproduction Branch
        run: |
          BRANCH_NAME="bugfix/issue-${{ github.event.issue.number }}"
          git config user.name "letitloop-bot[bot]"
          git config user.email "letitloop-bot@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          
          # Create reproduction template
          mkdir -p tests/reproductions
          cat << 'EOF' > "tests/reproductions/test_issue_${{ github.event.issue.number }}.py"
          import pytest
          
          def test_reproduction_issue_${{ github.event.issue.number }}():
              """Reproduction test scaffold for Issue #${{ github.event.issue.number }}."""
              # Add reproduction logic here
              assert True
          EOF
          
          git add tests/reproductions/
          git commit -m "chore(reproduction): scaffold test for issue #${{ github.event.issue.number }}"
          git push origin "$BRANCH_NAME"
          
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **LetItLoop Bot**: Scaffolded reproduction branch [\`${process.env.BRANCH_NAME}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/tree/${process.env.BRANCH_NAME}) with test template \`tests/reproductions/test_issue_${context.issue.number}.py\`.`
            });
