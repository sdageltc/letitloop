name: PR Rebase & Collision Guard

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  check-pr-health:
    if: ${{ github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect PR Health
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            
            // Check if PR has large deletions in core adapter folders
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const deletedCoreFiles = files.filter(f => f.status === 'removed' && (f.filename.startsWith('letitloop/adapters/') || f.filename.startsWith('adapters/')));

            if (deletedCoreFiles.length >= 2) {
              const fileList = deletedCoreFiles.map(f => `- \`${f.filename}\``).join('\n');
              const body = `⚠️ **Heads up @${pr.user.login}!**\n\nThis PR appears to delete existing core adapters:\n${fileList}\n\nThis usually happens when your feature branch was created from an older commit before our latest release. Please rebase your branch against the latest \`main\`:\n\n\`\`\`bash\ngit fetch origin\ngit rebase origin/main\ngit push --force-with-lease\n\`\`\`\n\nThis will restore all active adapters while preserving your changes! 🙌`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: body
              });
            }
