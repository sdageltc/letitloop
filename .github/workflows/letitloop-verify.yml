name: LetItLoop Proof-Carrying Verification Gate v2 (DCP-2.0 + LILWAL02)

# Canonical example workflow template — copy to your repo as .github/workflows/letitloop-verify.yml
# Billboard: every PR gets a cryptographic LetItLoop durability certificate in <2.5s (fail-closed)

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main]

# Top-level least-privilege: no write by default (10/10 OpenSSF Scorecard)
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level least-privilege (Scorecard: pin permissions per job)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # actions/setup-python v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v5 # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install LetItLoop (for AST/WAL bridge)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Fast lint + test still run before gate (optional but recommended)
      - name: Ruff lint (0 errors)
        run: python -m ruff check .

      - name: Pytest (fast, <60s)
        run: python -m pytest -q --durations=10

      # ─────────────────────────────────────────────────────────────
      # LetItLoop Action v2 — zero-dependency, single dist/index.js
      # In this repo we use the local path. In your repo use the
      # Marketplace pin (example below, replace SHA with release SHA):
      #
      #   - uses: sdageltc/letitloop/letitloop-action@v2 # replace with release SHA for pinning: sdageltc/letitloop/letitloop-action@<40-char-SHA> # v2.0.0
      #     with:
      #       token: ${{ secrets.GITHUB_TOKEN }}
      #       wal-dir: .bench_wal
      #       workspace: .
      #       fail-closed: "true"
      # ─────────────────────────────────────────────────────────────
      - name: LetItLoop Gate v2 — AST + WAL + HMAC Proof (fail-closed <2.5s)
        uses: ./letitloop-action
        id: gate
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wal-dir: ".bench_wal"
          workspace: "."
          fail-closed: "true"
          comment: "true"

      - name: Gate outputs (proof binding)
        if: always()
        run: |
          echo "verified=${{ steps.gate.outputs.verified }}"
          echo "proof-id=${{ steps.gate.outputs.proof-id }}"
          echo "ast-verdict=${{ steps.gate.outputs.ast-verdict }}"
          echo "wal-verdict=${{ steps.gate.outputs.wal-verdict }}"

      # Optional: keep DCP bench as separate artifact (not required for <2.5s gate)
      - name: DCP-2.0 Conformance Moat — bench compare all (optional, not in gate budget)
        if: always()
        run: |
          python -m letitloop.conformance.harness.runner --compare all || true
          cat results/leaderboard.json || cat docs/leaderboard.json || true
