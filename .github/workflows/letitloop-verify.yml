name: LetItLoop Proof Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run LetItLoop Verification Action
        uses: sdageltc/letitloop-action@76187c81c3dd765c616f0db307e5778542f14178 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          strict-ast: 'true'
          test-command: 'pytest tests/test_fast_sandbox.py tests/test_ast_node_splicer.py tests/test_schemas.py -q'
          auto-install-engine: 'false'
