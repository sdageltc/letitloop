name: DCP-2.0 Nightly Benchmark — Conformance Moat & Leaderboard

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "letitloop/conformance/**"
      - "orchestrator/**"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-benchmark pytest-xdist

      - name: Run DCP-2.0 matrix — bench compare all
        run: |
          python -m letitloop.conformance.harness.runner --compare all --export-json results/leaderboard.json --export-markdown docs/benchmark.md
          cat results/leaderboard.json | head -100

      - name: Generate SVG badges + HTML report
        run: |
          python -c "
          import json, pathlib
          from letitloop.conformance.reporter import write_badges, write_html_report
          data=json.loads(pathlib.Path('results/leaderboard.json').read_text())
          write_badges(data, out_dir='docs/badges')
          write_html_report('docs/bench/index.html', data)
          print('Badges + HTML generated')
          "
          ls -la docs/badges/ || true
          ls -la docs/bench/ || true

      - name: Upload leaderboard artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dcp-leaderboard
          path: |
            results/leaderboard.json
            docs/badges/
            docs/bench/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}bench/
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download leaderboard
        uses: actions/download-artifact@v4
        with:
          name: dcp-leaderboard
          path: _site_src

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          mkdir -p _site/bench
          cp -r _site_src/docs/bench/* _site/bench/ 2>/dev/null || cp _site_src/results/leaderboard.json _site/bench/ 2>/dev/null || true
          cp -r _site_src/docs/badges _site/ 2>/dev/null || true
          ls -la _site/ || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
