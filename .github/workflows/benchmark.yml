name: DCP-2.0 Nightly Benchmark — Conformance Moat & Leaderboard

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "letitloop/conformance/**"
      - "orchestrator/**"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69ea43a64d8f4c2d33e0242004b16d7ea04 # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run DCP-2.0 matrix — bench compare all
        run: |
          python -m letitloop.conformance.harness.runner --compare all --export-json results/leaderboard.json --export-markdown docs/benchmark.md
          cat results/leaderboard.json | head -100

      - name: Generate SVG badges + HTML report
        run: |
          python -c "
          import json, pathlib
          from letitloop.conformance.reporter import write_badges, write_html_report
          data=json.loads(pathlib.Path('results/leaderboard.json').read_text())
          write_badges(data, out_dir='docs/badges')
          write_html_report('docs/bench/index.html', data)
          print('Badges + HTML generated')
          "
          ls -la docs/badges/ || true
          ls -la docs/bench/ || true

      - name: Upload leaderboard artifact
        uses: actions/upload-artifact@6f51ac03b1675a5689d4447e4a76005963250e7 # v4.0.0
        with:
          name: dcp-leaderboard
          path: |
            results/leaderboard.json
            docs/badges/
            docs/bench/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}bench/
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download leaderboard
        uses: actions/download-artifact@fa0a91b85d4f404e44461999790ef7412590fc8 # v4.1.3
        with:
          name: dcp-leaderboard
          path: _site_src

      - name: Prepare Pages site
        run: |
          mkdir -p _site/bench
          cp -r _site_src/docs/bench/* _site/bench/ 2>/dev/null || cp _site_src/results/leaderboard.json _site/bench/ 2>/dev/null || true
          cp -r _site_src/docs/badges _site/ 2>/dev/null || true
          ls -la _site/bench/ || true

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c46e8d6ff # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d93310a00003ff21d55c2c00 # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac18386b2b7c580cc25579958d1d998 # v4.0.5
