name: Gentle Stale Issue & PR Tracker

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: -1 # Never close automatically
          stale-issue-message: '👋 This issue has been open for 60 days without activity. If this is still relevant, please leave a comment to keep it active!'
          stale-pr-message: '👋 This PR has been open for 60 days without activity. If you are still working on this, please let us know!'
          stale-issue-label: 'status: stale'
          stale-pr-label: 'status: stale'
          exempt-issue-labels: 'pinned,security,good-first-issue'
          exempt-pr-labels: 'wip,pinned'
