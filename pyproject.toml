[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "letitloop"
version = "0.1.0"
description = "Autonomous Macro-Task Control Loop & Verification Engine. DAG Contract Planning, Crash-Proof Supervisor (WAL), Deterministic Verifiers, Multi-Lens QC, and Universal MCP / Skill Support."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "letitloop Contributors", email = "oguzhankayanbusiness@gmail.com" }
]
keywords = [
    "autonomous-agents",
    "agent-loop",
    "mcp",
    "mcp-server",
    "claude-code",
    "cursor",
    "antigravity",
    "hermes-agent",
    "opencode",
    "cline",
    "windsurf",
    "codex",
    "openai-codex",
    "dag-planner",
    "coding-agent",
    "orchestration",
    "zero-trust-verification",
    "quality-plane",
    "local-llm",
    "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/sdageltc/letitloop"
Documentation = "https://github.com/sdageltc/letitloop#readme"
Repository = "https://github.com/sdageltc/letitloop.git"
"Bug Tracker" = "https://github.com/sdageltc/letitloop/issues"
Discussions = "https://github.com/sdageltc/letitloop/discussions"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]

[project.scripts]
lil = "orchestrator.cli:main"
letitloop = "orchestrator.cli:main"
letitloop-mcp = "orchestrator.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*"]
exclude = ["scratch*", "tests*", ".git*", "__pycache__*"]

[tool.setuptools.package-data]
orchestrator = ["*.md"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --tb=short"
testpaths = ["tests"]
markers = [
    "fast: Pure logic tests, no live worker or subprocess",
    "integration: CLI flow tests, may use subprocess but avoid live worker",
    "proof: Real worker-backed end-to-end proofs, slow and expensive",
    "phase2: Phase 2 supervisor and multi-contract tests",
    "benchmark: Performance benchmark tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["orchestrator"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
