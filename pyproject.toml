[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "letitloop"
version = "0.5.2"
description = "Make any Python function crash-proof in 3 lines. Zero tokens wasted on SIGKILL."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "sdageltc", email = "sdageltc@users.noreply.github.com" }
]
keywords = [
    "agent-loop",
    "durable",
    "wal",
    "crash-recovery",
    "mcp",
    "langchain",
    "crewai",
    "github-action",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://sdageltc.github.io/letitloop/"
Documentation = "https://github.com/sdageltc/letitloop#readme"
Repository = "https://github.com/sdageltc/letitloop"
"Bug Tracker" = "https://github.com/sdageltc/letitloop/issues"
Discussions = "https://github.com/sdageltc/letitloop/discussions"

[project.optional-dependencies]
compliance = [
    "cryptography>=41.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.100.0",
    "jsonschema>=4.0.0",
    "ruff>=0.1.0",
    "bandit>=1.7.5",
    "pre-commit>=3.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "langgraph>=1.2,<2",
]
financial-agent = [
    "certifi>=2024.0.0",
    "langgraph>=1.2,<2",
    "yfinance>=1.0,<2",
]
openai = [
    "openai>=1.0.0",
]
anthropic = [
    "anthropic>=0.18.0",
]
google = [
    "google-generativeai>=0.4.0",
]
fastapi = [
    "fastapi>=0.100.0",
]
all-providers = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.4.0",
]
telemetry = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "prometheus-client>=0.19",
]

[project.scripts]
lil = "orchestrator.cli:main"
letitloop = "orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*", "letitloop*", "conformance*"]
exclude = ["scratch*", "tests*", ".git*", "__pycache__*"]

[tool.setuptools.package-data]
orchestrator = ["*.md"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --tb=short -n auto --dist=loadscope -p no:benchmark -p no:opik -p no:langflow_sdk -p no:langsmith -p no:typeguard --durations=10 --durations-min=1.0"
testpaths = ["tests"]
markers = [
    "fast: Pure logic tests, no live worker or subprocess",
    "integration: CLI flow tests, may use subprocess but avoid live worker",
    "proof: Real worker-backed end-to-end proofs, slow and expensive",
    "phase2: Phase 2 supervisor and multi-contract tests",
    "benchmark: Performance benchmark tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["orchestrator", "letitloop", "tests"]
force-exclude = true
exclude = [
    "scratch",
    ".venv",
    "venv",
    "dist",
    "build",
    ".benchmarks",
    "htmlcov",
    ".github",
    "results",
    ".bench_wal",
    "node_modules",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.coverage.run]
source = ["orchestrator"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
